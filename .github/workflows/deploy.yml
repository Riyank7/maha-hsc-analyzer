name: Test and deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Test authentication
        run: npm test
      - name: Validate paper data
        run: python3 scripts/validate_data.py
      - name: Build site
        run: npm run build
      - name: Compile Pages Functions
        run: ./node_modules/.bin/wrangler pages functions build functions --outfile /tmp/hsc-auth-worker.js
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Configure the Cloudflare deployment secret and account variable before deploying.' >&2
            exit 1
          fi
          ./node_modules/.bin/wrangler pages deploy dist --project-name maha-hsc-analyzer --branch main --commit-hash "$GITHUB_SHA" --commit-message 'GitHub Actions deployment'
      - name: Verify production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/check_deployment.cjs
      - name: Deployment link
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && success()
        run: echo 'Published https://maha-hsc-analyzer.pages.dev — tested revision `${{ github.sha }}`.' >> "$GITHUB_STEP_SUMMARY"
